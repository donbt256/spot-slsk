name: Resolve Spotify URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve Spotify metadata
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python scripts/main.py

      - name: Show resolved tracks
        run: |
          python - <<'PY'
          import json

          with open("state/tracks.json", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Tracks: {len(data['tracks'])}")

          for track in data["tracks"]:
              print(
                  f"{track['artist']} - "
                  f"{track['title']} "
                  f"({track['album']})"
              )
          PY

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/tracks.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update Spotify track state"
          git push
