name: Spotify Music Acquisition

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout spot-slsk
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Spotify URLs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python scripts/main.py

      - name: Start slskd
        env:
          SOULSEEK_USERNAME: ${{ secrets.SOULSEEK_USERNAME }}
          SOULSEEK_PASSWORD: ${{ secrets.SOULSEEK_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/slskd"
          mkdir -p "$RUNNER_TEMP/music-downloads"
          mkdir -p "$RUNNER_TEMP/music-downloads-incomplete"

          docker run \
            --detach \
            --name slskd \
            --publish 127.0.0.1:5030:5030 \
            --publish 127.0.0.1:50300:50300 \
            --env "SLSKD_SLSK_USERNAME=$SOULSEEK_USERNAME" \
            --env "SLSKD_SLSK_PASSWORD=$SOULSEEK_PASSWORD" \
            --env "SLSKD_NO_AUTH=true" \
            --env "SLSKD_REMOTE_CONFIGURATION=false" \
            --env "SLSKD_DOWNLOAD_SLOTS=8" \
            --volume "$RUNNER_TEMP/slskd:/app" \
            --volume "$RUNNER_TEMP/music-downloads:/downloads" \
            --volume "$RUNNER_TEMP/music-downloads-incomplete:/incomplete" \
            slskd/slskd:latest

      - name: Wait for slskd
        run: |
          echo "Waiting for slskd HTTP API..."

          for i in {1..60}; do
            if curl --silent --fail \
              http://127.0.0.1:5030/api/v0/application \
              >/dev/null 2>&1; then
              echo "slskd HTTP API is ready."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "slskd failed to become ready."
              docker logs slskd
              exit 1
            fi

            sleep 2
          done

          echo "Waiting for Soulseek connection..."

          for i in {1..90}; do
            if docker logs slskd 2>&1 | grep -qi \
              "logged in to the Soulseek server"; then
              echo "slskd is logged into Soulseek."
              break
            fi

            if [ "$i" -eq 90 ]; then
              echo "slskd did not log into Soulseek."
              docker logs slskd
              exit 1
            fi

            sleep 2
          done

      - name: Search Soulseek
        env:
          SLSKD_URL: http://127.0.0.1:5030
        run: |
          python scripts/search.py

      - name: Screen ambiguous matches with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MATCH_MODEL: gpt-5-nano
        run: |
          python scripts/llm_matcher.py

      - name: Download matched tracks
        env:
          SLSKD_URL: http://127.0.0.1:5030
          SOULSEEK_DOWNLOAD_DIR: ${{ runner.temp }}/music-downloads
        run: |
          python scripts/download.py

      - name: Publish downloaded tracks
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          python scripts/publish.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/tracks.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update music acquisition state"
            git push
          fi

      - name: Diagnostic state summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("state/tracks.json")

          if not path.exists():
              print("tracks.json does not exist.")
              raise SystemExit(0)

          data = json.loads(path.read_text())
          tracks = data.get("tracks", [])

          print(f"Tracks: {len(tracks)}")

          for track in tracks:
              spotify = track.get("spotify", {})
              acquisition = track.get("acquisition", {})
              search = track.get("search", {})
              matching = track.get("matching", {})

              print()
              print(
                  f"{spotify.get('artist', '?')} - "
                  f"{spotify.get('title', '?')}"
              )
              print(f"Status: {acquisition.get('status')}")
              print(
                  f"Search candidates: "
                  f"{len(search.get('candidates', []))}"
              )

              deterministic = matching.get("deterministic", {})
              if deterministic:
                  print(
                      f"Deterministic decision: "
                      f"{deterministic.get('decision')}"
                  )

                  candidates = deterministic.get("candidates", [])

                  if candidates:
                      best = candidates[0]
                      print(
                          f"Best: {best.get('filename')}"
                      )
                      print(
                          f"User: {best.get('username')}"
                      )
                      print(
                          f"Score: {best.get('score')}"
                      )

              llm = matching.get("llm")

              if llm:
                  print(
                      f"LLM decision: "
                      f"{llm.get('decision')}"
                  )
                  print(
                      f"LLM confidence: "
                      f"{llm.get('confidence')}"
                  )
                  print(
                      f"LLM candidate: "
                      f"{llm.get('candidate_id')}"
                  )

              match = acquisition.get("match")

              if match:
                  candidates = match.get("candidates", [])

                  if candidates:
                      selected = candidates[0]
                      print(
                          f"Selected: "
                          f"{selected.get('filename')}"
                      )

              file_info = acquisition.get("file")

              if file_info:
                  print(
                      f"Downloaded: "
                      f"{file_info.get('path')}"
                  )

              library = acquisition.get("library")

              if library:
                  print(
                      f"Library: "
                      f"{library.get('repo')}"
                  )
                  print(
                      f"Library path: "
                      f"{library.get('path')}"
                  )
          PY

      - name: Show slskd logs on failure
        if: failure()
        run: |
          docker logs slskd || true

      - name: Stop slskd
        if: always()
        run: |
          docker rm --force slskd || true