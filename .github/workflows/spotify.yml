name: Resolve Spotify and Search Soulseek

on: workflow_dispatch

permissions:
  contents: write

jobs:
  resolve-and-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve Spotify metadata
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SLSKD_API_KEY: ${{ secrets.SLSKD_API_KEY }}
        run: |
          python scripts/main.py

      - name: Start slskd
        env:
          SOULSEEK_USERNAME: ${{ secrets.SOULSEEK_USERNAME }}
          SOULSEEK_PASSWORD: ${{ secrets.SOULSEEK_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/slskd"
          mkdir -p "$RUNNER_TEMP/music-downloads"

          docker run \
            --detach \
            --name slskd \
            --publish 127.0.0.1:5030:5030 \
            --publish 127.0.0.1:50300:50300 \
            --env "SLSKD_SLSK_USERNAME=$SOULSEEK_USERNAME" \
            --env "SLSKD_SLSK_PASSWORD=$SOULSEEK_PASSWORD" \
            --env "SLSKD_NO_AUTH=true" \
            --env "SLSKD_REMOTE_CONFIGURATION=false" \
            --env "SLSKD_DOWNLOAD_SLOTS=8" \
            --env "SLSKD_DOWNLOADS_DIR=/downloads" \
            --env "SLSKD_INCOMPLETE_DIR=/incomplete" \
            --volume "$RUNNER_TEMP/slskd:/app" \
            --volume "$RUNNER_TEMP/music-downloads:/downloads" \
            --volume "$RUNNER_TEMP/music-downloads-incomplete:/incomplete" \
            slskd/slskd:latest

      - name: Wait for slskd
        run: |
          echo "Waiting for slskd HTTP server..."

          for i in {1..60}; do
            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:5030/ \
              > /dev/null; then
              echo "slskd HTTP server is ready."
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx slskd; then
              echo "slskd container stopped unexpectedly."
              docker logs slskd || true
              exit 1
            fi

            sleep 2
          done

          if ! curl \
            --silent \
            --show-error \
            --fail \
            http://127.0.0.1:5030/ \
            > /dev/null; then
            echo "slskd HTTP server did not become ready."
            docker logs slskd || true
            exit 1
          fi

          echo "Waiting for Soulseek login..."

          for i in {1..60}; do
            if docker logs slskd 2>&1 | \
              grep -q "Logged in to the Soulseek server"; then
              echo "slskd is connected to Soulseek."
              exit 0
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx slskd; then
              echo "slskd container stopped unexpectedly."
              docker logs slskd || true
              exit 1
            fi

            sleep 2
          done

          echo "slskd did not log in to Soulseek."
          docker logs slskd || true
          exit 1

      - name: Search Soulseek
        env:
          SLSKD_URL: http://127.0.0.1:5030
        run: |
          python scripts/search.py
      - name: Download matched tracks
        env:
          SLSKD_URL: http://127.0.0.1:5030
          SOULSEEK_DOWNLOAD_DIR: ${{ runner.temp }}/music-downloads
        run: |
          python scripts/download.py
      - name: Publish to music library
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
          GITHUB_OWNER: donbt256
          MUSIC_REPO_PREFIX: music-library-
          MUSIC_LIBRARY_WORKDIR: ${{ runner.temp }}/music-library
        run: |
          python scripts/publish.py
      - name: Show search results
        run: |
          python - <<'PY'
          import json

          with open("state/tracks.json", encoding="utf-8") as f:
              data = json.load(f)

          tracks = data["tracks"]

          print()
          print(f"Tracks: {len(tracks)}")
          print()

          for track in tracks:
              spotify = track["spotify"]
              acquisition = track.get("acquisition", {})
              match = acquisition.get("match") or {}
              candidates = match.get("candidates", [])

              print(
                  f"{spotify['artist']} - "
                  f"{spotify['title']}"
              )

              print(
                  f"  Status: "
                  f"{acquisition.get('status')}"
              )

              print(
                  f"  Candidates: "
                  f"{len(candidates)}"
              )

              if candidates:
                  best = candidates[0]

                  print(
                      f"  Best: "
                      f"{best.get('filename')}"
                  )

                  print(
                      f"  User: "
                      f"{best.get('username')}"
                  )

                  print(
                      f"  Score: "
                      f"{best['match']['score']}"
                  )

              print()
          PY

      - name: Show slskd logs
        if: always()
        run: |
          docker logs slskd || true

      - name: Stop slskd
        if: always()
        run: |
          docker rm --force slskd || true

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/tracks.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Search Soulseek candidates"
          git push